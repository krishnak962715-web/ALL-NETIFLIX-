<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - ALL NETIFLIX</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0a0a0a; color: #ffffff; padding: 30px; }
        header { margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .logo { font-size: 24px; font-weight: 700; color: #fff; }
        .logo span { color: #E50914; }
        .admin-container { display: flex; gap: 30px; flex-wrap: wrap; }
        .form-section { background-color: #141414; padding: 25px; border-radius: 12px; flex: 1; min-width: 300px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .form-section h2 { margin-bottom: 20px; color: #E50914; font-size: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #ccc; }
        .form-group input, .form-group select { width: 100%; padding: 10px 15px; background-color: #1a1a1a; border: 1px solid #333; border-radius: 6px; color: white; outline: none; transition: 0.3s; }
        .form-group input:focus, .form-group select:focus { border-color: #E50914; }
        .btn-submit { background-color: #E50914; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { background-color: #f40612; }
        
        /* Manage & Delete Section Styles */
        .drama-card-manage { background-color: #1a1a1a; padding: 15px; border: 1px solid #333; border-radius: 8px; margin-bottom: 15px; }
        .drama-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 10px; }
        .drama-header span { font-size: 16px; font-weight: 700; color: #E50914; }
        .btn-delete { background-color: transparent; border: 1px solid #E50914; color: #E50914; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; transition: 0.3s; }
        .btn-delete:hover { background-color: #E50914; color: white; }
        
        .season-block { margin-top: 10px; padding-left: 10px; border-left: 2px solid #333; }
        .season-title { font-size: 13px; color: #aaa; margin-bottom: 8px; font-weight: 600; }
        .ep-list-item { display: flex; justify-content: space-between; align-items: center; background-color: #222; padding: 8px 12px; border-radius: 4px; margin-bottom: 5px; }
        .ep-list-item span { font-size: 12px; color: #ddd; }
        .btn-delete-ep { background-color: transparent; border: 1px solid #ff9800; color: #ff9800; padding: 4px 8px; border-radius: 4px; font-size: 10px; cursor: pointer; transition: 0.3s; }
        .btn-delete-ep:hover { background-color: #ff9800; color: white; }
    </style>
</head>
<body>

    <header>
        <div class="logo">ALL <span>NETIFLIX</span> - Admin Panel</div>
    </header>

    <div class="admin-container">
        
        <!-- Add New Drama Form -->
        <div class="form-section">
            <h2>Add New Drama</h2>
            <form id="addDramaForm">
                <div class="form-group">
                    <label>Drama Name</label>
                    <input type="text" id="dramaName" placeholder="e.g. Stranger Things" required>
                </div>
                <div class="form-group">
                    <label>Poster Image URL</label>
                    <input type="url" id="dramaPoster" placeholder="https://..." required>
                </div>
                <button type="submit" class="btn-submit" id="dramaBtn">Add Drama</button>
            </form>
        </div>

        <!-- Add Episode Form -->
        <div class="form-section">
            <h2>Add New Episode</h2>
            <form id="addEpisodeForm">
                <div class="form-group">
                    <label>Select Drama</label>
                    <select id="selectDrama" required>
                        <option value="">-- Loading Dramas... --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Season Name</label>
                    <input type="text" id="seasonName" placeholder="e.g. Season 1" required>
                </div>
                <div class="form-group">
                    <label>Episode Title</label>
                    <input type="text" id="epTitle" placeholder="e.g. Episode 1" required>
                </div>
                <div class="form-group">
                    <label>Video Stream Link</label>
                    <input type="url" id="streamLink" placeholder="https://..." required>
                </div>
                <button type="submit" class="btn-submit" id="epBtn">Add Episode</button>
            </form>
        </div>
        
        <!-- Manage & Delete Section (Updated with Episode Delete) -->
        <div class="form-section" style="flex: 100%;">
            <h2>Manage & Delete</h2>
            <p style="font-size: 12px; color: #888; margin-bottom: 15px;">Delete an entire drama, or remove specific episodes from a season.</p>
            <div id="dramaListContainer">
                <p style="font-size: 14px; color: #666;">Loading data...</p>
            </div>
        </div>

    </div>

    <!-- Firebase SDK aur Database Connection -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, getDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Tumhara Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDRiqovyOM5jonXjMJ2rqkTA-LW46E2Kmo",
            authDomain: "movie-c8d24.firebaseapp.com",
            projectId: "movie-c8d24",
            storageBucket: "movie-c8d24.firebasestorage.app",
            messagingSenderId: "660399747517",
            appId: "1:660399747517:web:3797877ff37b6b8a59a2d4",
            measurementId: "G-V7HK4RBN1X"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Dropdown aur Episode list ko load karne ka function
        async function loadData() {
            const dropdown = document.getElementById('selectDrama');
            const listContainer = document.getElementById('dramaListContainer');
            
            dropdown.innerHTML = '<option value="">-- Choose Drama --</option>';
            listContainer.innerHTML = '';
            
            try {
                const querySnapshot = await getDocs(collection(db, "dramas"));
                
                if (querySnapshot.empty) {
                    listContainer.innerHTML = '<p style="font-size: 14px; color: #666;">No dramas found in database.</p>';
                    return;
                }

                querySnapshot.forEach((documentSnapshot) => {
                    let data = documentSnapshot.data();
                    let id = documentSnapshot.id;
                    
                    // Dropdown update
                    dropdown.innerHTML += `<option value="${id}">${data.name}</option>`;
                    
                    // Box Start
                    let html = `
                        <div class="drama-card-manage">
                            <div class="drama-header">
                                <span>${data.name}</span>
                                <button type="button" class="btn-delete" onclick="deleteDrama('${id}')">Delete Drama</button>
                            </div>
                    `;
                    
                    // Episodes aur seasons show karna
                    if (data.seasons && Object.keys(data.seasons).length > 0) {
                        for (let season in data.seasons) {
                            html += `<div class="season-block">
                                        <div class="season-title">${season}</div>`;
                            
                            data.seasons[season].forEach((ep, index) => {
                                html += `
                                    <div class="ep-list-item">
                                        <span>${ep.epTitle}</span>
                                        <button type="button" class="btn-delete-ep" onclick="deleteEpisode('${id}', '${season}', ${index})">Delete Ep</button>
                                    </div>
                                `;
                            });
                            
                            html += `</div>`; // Season block close
                        }
                    } else {
                        html += `<p style="font-size: 12px; color: #666;">No episodes added yet.</p>`;
                    }

                    html += `</div>`; // Card close
                    listContainer.innerHTML += html;
                });
            } catch (error) {
                console.error("Error loading data:", error);
                dropdown.innerHTML = '<option value="">Error loading data</option>';
                listContainer.innerHTML = '<p style="font-size: 14px; color: #E50914;">Error loading data</p>';
            }
        }
        
        // Pura Drama Delete Karne ka function
        window.deleteDrama = async function(id) {
            const confirmDelete = confirm("Kya aap sach mein is poore drama ko delete karna chahte hain?");
            if (confirmDelete) {
                try {
                    await deleteDoc(doc(db, "dramas", id));
                    alert("Drama deleted successfully!");
                    loadData();
                } catch (error) {
                    console.error("Error deleting drama:", error);
                    alert("Error deleting drama. Check console.");
                }
            }
        }

        // Sirf Ek Episode Delete Karne ka function
        window.deleteEpisode = async function(dramaId, seasonName, episodeIndex) {
            const confirmDelete = confirm("Kya aap sach mein sirf is Episode ko delete karna chahte hain?");
            if (confirmDelete) {
                try {
                    const dramaRef = doc(db, "dramas", dramaId);
                    const dramaSnap = await getDoc(dramaRef);
                    
                    if (dramaSnap.exists()) {
                        let dramaData = dramaSnap.data();
                        let seasons = dramaData.seasons;
                        
                        // Array (List) se episode ko bahar nikalo
                        seasons[seasonName].splice(episodeIndex, 1);
                        
                        // Agar us season mein ek bhi episode nahi bacha, toh season ka naam bhi hata do
                        if (seasons[seasonName].length === 0) {
                            delete seasons[seasonName];
                        }
                        
                        // Updated list ko wapas database mein save karo
                        await updateDoc(dramaRef, { seasons: seasons });
                        alert("Episode deleted successfully!");
                        loadData(); // UI ko refresh karo
                    }
                } catch (error) {
                    console.error("Error deleting episode:", error);
                    alert("Error deleting episode. Check console.");
                }
            }
        }

        // Page load hone par data lao
        loadData();

        // Add Drama to Firebase
        document.getElementById('addDramaForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('dramaBtn');
            btn.innerText = "Adding...";
            
            const name = document.getElementById('dramaName').value;
            const poster = document.getElementById('dramaPoster').value;

            try {
                await addDoc(collection(db, "dramas"), {
                    name: name,
                    poster: poster,
                    seasons: {}
                });
                alert("Drama Added Successfully!");
                this.reset();
                loadData();
            } catch (error) {
                console.error("Error adding drama:", error);
                alert("Error adding drama. Check console for details.");
            }
            btn.innerText = "Add Drama";
        });

        // Add Episode to Firebase
        document.getElementById('addEpisodeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('epBtn');
            btn.innerText = "Adding...";

            const dramaId = document.getElementById('selectDrama').value;
            const season = document.getElementById('seasonName').value;
            const epTitle = document.getElementById('epTitle').value;
            const stream = document.getElementById('streamLink').value;

            try {
                const dramaRef = doc(db, "dramas", dramaId);
                const dramaSnap = await getDoc(dramaRef);
                
                if (dramaSnap.exists()) {
                    let dramaData = dramaSnap.data();
                    let seasons = dramaData.seasons || {};
                    
                    if (!seasons[season]) {
                        seasons[season] = [];
                    }
                    
                    seasons[season].push({ epTitle: epTitle, stream: stream, dl: stream });

                    await updateDoc(dramaRef, { seasons: seasons });
                    alert("Episode Added Successfully!");
                    this.reset();
                    loadData(); // Episode add hone ke baad UI refresh karo
                } else {
                    alert("Drama not found in database.");
                }
            } catch (error) {
                console.error("Error adding episode:", error);
                alert("Error adding episode. Check console for details.");
            }
            btn.innerText = "Add Episode";
        });
    </script>
</body>
</html>
