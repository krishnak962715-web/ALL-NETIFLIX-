<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - ALL NETIFLIX</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0a0a0a; color: #ffffff; padding: 30px; }
        header { margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .logo { font-size: 24px; font-weight: 700; color: #fff; }
        .logo span { color: #E50914; }
        .admin-container { display: flex; gap: 30px; flex-wrap: wrap; }
        .form-section { background-color: #141414; padding: 25px; border-radius: 12px; flex: 1; min-width: 300px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .form-section h2 { margin-bottom: 20px; color: #E50914; font-size: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #ccc; }
        .form-group input, .form-group select { width: 100%; padding: 10px 15px; background-color: #1a1a1a; border: 1px solid #333; border-radius: 6px; color: white; outline: none; transition: 0.3s; }
        .form-group input:focus, .form-group select:focus { border-color: #E50914; }
        .btn-submit { background-color: #E50914; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { background-color: #f40612; }
    </style>
</head>
<body>

    <header>
        <div class="logo">ALL <span>NETIFLIX</span> - Admin Panel</div>
    </header>

    <div class="admin-container">
        
        <!-- Add New Drama Form -->
        <div class="form-section">
            <h2>Add New Drama</h2>
            <form id="addDramaForm">
                <div class="form-group">
                    <label>Drama Name</label>
                    <input type="text" id="dramaName" placeholder="e.g. Stranger Things" required>
                </div>
                <div class="form-group">
                    <label>Poster Image URL</label>
                    <input type="url" id="dramaPoster" placeholder="https://..." required>
                </div>
                <button type="submit" class="btn-submit" id="dramaBtn">Add Drama</button>
            </form>
        </div>

        <!-- Add Episode Form -->
        <div class="form-section">
            <h2>Add New Episode</h2>
            <form id="addEpisodeForm">
                <div class="form-group">
                    <label>Select Drama</label>
                    <select id="selectDrama" required>
                        <option value="">-- Loading Dramas... --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Season Name</label>
                    <input type="text" id="seasonName" placeholder="e.g. Season 1" required>
                </div>
                <div class="form-group">
                    <label>Episode Title</label>
                    <input type="text" id="epTitle" placeholder="e.g. Episode 1" required>
                </div>
                <div class="form-group">
                    <label>Video Stream Link</label>
                    <input type="url" id="streamLink" placeholder="https://..." required>
                </div>
                <button type="submit" class="btn-submit" id="epBtn">Add Episode</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK aur Database Connection -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Tumhara Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDRiqovyOM5jonXjMJ2rqkTA-LW46E2Kmo",
            authDomain: "movie-c8d24.firebaseapp.com",
            projectId: "movie-c8d24",
            storageBucket: "movie-c8d24.firebasestorage.app",
            messagingSenderId: "660399747517",
            appId: "1:660399747517:web:3797877ff37b6b8a59a2d4",
            measurementId: "G-V7HK4RBN1X"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Load Dramas into Dropdown
        async function loadDropdown() {
            const dropdown = document.getElementById('selectDrama');
            dropdown.innerHTML = '<option value="">-- Choose Drama --</option>';
            try {
                const querySnapshot = await getDocs(collection(db, "dramas"));
                querySnapshot.forEach((doc) => {
                    let data = doc.data();
                    dropdown.innerHTML += `<option value="${doc.id}">${data.name}</option>`;
                });
            } catch (error) {
                console.error("Error loading dramas:", error);
                dropdown.innerHTML = '<option value="">Error loading data</option>';
            }
        }
        
        // Page load hote hi dropdown mein data bhar do
        loadDropdown();

        // Add Drama to Firebase
        document.getElementById('addDramaForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('dramaBtn');
            btn.innerText = "Adding...";
            
            const name = document.getElementById('dramaName').value;
            const poster = document.getElementById('dramaPoster').value;

            try {
                await addDoc(collection(db, "dramas"), {
                    name: name,
                    poster: poster,
                    seasons: {} // Blank season setup
                });
                alert("Drama Added Successfully!");
                this.reset();
                loadDropdown(); // Naya drama add hone par dropdown update karo
            } catch (error) {
                console.error("Error adding drama:", error);
                alert("Error adding drama. Check console for details.");
            }
            btn.innerText = "Add Drama";
        });

        // Add Episode to Firebase
        document.getElementById('addEpisodeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('epBtn');
            btn.innerText = "Adding...";

            const dramaId = document.getElementById('selectDrama').value;
            const season = document.getElementById('seasonName').value;
            const epTitle = document.getElementById('epTitle').value;
            const stream = document.getElementById('streamLink').value;

            try {
                const dramaRef = doc(db, "dramas", dramaId);
                const dramaSnap = await getDoc(dramaRef);
                
                if (dramaSnap.exists()) {
                    let dramaData = dramaSnap.data();
                    let seasons = dramaData.seasons || {};
                    
                    // Agar season nahi hai, toh naya empty list banao
                    if (!seasons[season]) {
                        seasons[season] = [];
                    }
                    
                    // Naya episode us list mein daal do
                    seasons[season].push({ epTitle: epTitle, stream: stream, dl: stream });

                    // Database update karo
                    await updateDoc(dramaRef, { seasons: seasons });
                    alert("Episode Added Successfully!");
                    this.reset();
                } else {
                    alert("Drama not found in database.");
                }
            } catch (error) {
                console.error("Error adding episode:", error);
                alert("Error adding episode. Check console for details.");
            }
            btn.innerText = "Add Episode";
        });
    </script>
</body>
</html>
